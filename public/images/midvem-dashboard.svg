<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mvBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b161d"/>
      <stop offset="100%" stop-color="#111f29"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8622A"/>
      <stop offset="100%" stop-color="#FF8A50"/>
    </linearGradient>
    <linearGradient id="aiCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A4D68" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1A8FB5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8622A" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="mvShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#mvBgGrad)"/>

  <!-- Top Window Bar -->
  <rect x="0" y="0" width="800" height="48" fill="#0A0A0F" rx="16"/>
  <rect x="0" y="32" width="800" height="16" fill="#0A0A0F"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1E293B" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="24" cy="24" r="5.5" fill="#ef4444" opacity="0.85"/>
  <circle cx="42" cy="24" r="5.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="60" cy="24" r="5.5" fill="#10b981" opacity="0.85"/>

  <!-- Address Bar Pill -->
  <rect x="90" y="12" width="240" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.7"/>
  <circle cx="106" cy="24" r="3.5" fill="#10b981"/>
  <text x="118" y="28" fill="#94a3b8" font-family="monospace" font-size="11">app.midvem.com/inbox/unified</text>

  <!-- Status Pill -->
  <rect x="620" y="12" width="160" height="24" rx="12" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="0.7"/>
  <circle cx="636" cy="24" r="4" fill="#34d399"/>
  <text x="648" y="28" fill="#6ee7b7" font-family="system-ui, sans-serif" font-weight="600" font-size="10">Sistem Çevrimiçi (AI Aktif)</text>

  <!-- Mini Sidebar (Left) -->
  <rect x="0" y="48" width="60" height="452" fill="#070d11"/>
  <line x1="60" y1="48" x2="60" y2="500" stroke="#1E293B" stroke-width="1"/>

  <!-- Sidebar Icons -->
  <rect x="12" y="65" width="36" height="36" rx="10" fill="url(#coralGrad)"/>
  <text x="30" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="15" text-anchor="middle">💬</text>

  <rect x="14" y="115" width="32" height="32" rx="8" fill="#1E293B"/>
  <text x="30" y="136" fill="#94a3b8" font-size="14" text-anchor="middle">📥</text>

  <rect x="14" y="160" width="32" height="32" rx="8" fill="#1E293B"/>
  <text x="30" y="181" fill="#94a3b8" font-size="14" text-anchor="middle">👥</text>

  <rect x="14" y="205" width="32" height="32" rx="8" fill="#1E293B"/>
  <text x="30" y="226" fill="#94a3b8" font-size="14" text-anchor="middle">📊</text>

  <rect x="14" y="250" width="32" height="32" rx="8" fill="#1E293B"/>
  <text x="30" y="271" fill="#E8622A" font-size="14" text-anchor="middle">🧠</text>

  <!-- Bottom Avatar in Sidebar -->
  <circle cx="30" cy="465" r="16" fill="#263d4a" stroke="#E8622A" stroke-width="1.5"/>
  <text x="30" y="470" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">MV</text>

  <!-- Inbox Column (Width: 240px) -->
  <rect x="60" y="48" width="250" height="452" fill="#0d1b23"/>
  <line x1="310" y1="48" x2="310" y2="500" stroke="#1E293B" stroke-width="1"/>

  <!-- Inbox Header -->
  <text x="75" y="78" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Birleşik Gelen Kutusu</text>
  <rect x="252" y="66" width="44" height="18" rx="9" fill="#E8622A"/>
  <text x="274" y="79" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="9" text-anchor="middle">CANLI</text>
  <text x="75" y="96" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">12 okunmamış görüşme</text>

  <!-- Filter Pills -->
  <g transform="translate(75, 108)">
    <rect x="0" y="0" width="48" height="22" rx="6" fill="#E8622A"/>
    <text x="24" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Tümü</text>

    <rect x="54" y="0" width="76" height="22" rx="6" fill="#1E293B"/>
    <circle cx="64" cy="11" r="3" fill="#25D366"/>
    <text x="72" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">WhatsApp</text>

    <rect x="136" y="0" width="84" height="22" rx="6" fill="#1E293B"/>
    <circle cx="146" cy="11" r="3" fill="#E1306C"/>
    <text x="154" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Instagram</text>
  </g>

  <!-- Inbox Thread 1 (Active) -->
  <g transform="translate(60, 142)">
    <rect x="0" y="0" width="250" height="74" fill="#162934"/>
    <rect x="0" y="0" width="3" height="74" fill="#E8622A"/>
    <circle cx="24" cy="22" r="10" fill="#25D366" fill-opacity="0.2"/>
    <text x="24" y="26" fill="#25D366" font-size="11" text-anchor="middle">✆</text>
    <text x="42" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Ahmet Yılmaz</text>
    <text x="235" y="24" fill="#E8622A" font-family="system-ui, sans-serif" font-weight="600" font-size="9" text-anchor="end">1 dk</text>
    <text x="42" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Toptan siparişte teslimat süresi...</text>
    <rect x="42" y="48" width="95" height="18" rx="4" fill="#581c87" fill-opacity="0.8" stroke="#7e22ce" stroke-width="0.5"/>
    <text x="48" y="60" fill="#d8b4fe" font-family="system-ui, sans-serif" font-weight="600" font-size="9">✦ AI Taslağı Hazır</text>
  </g>

  <!-- Inbox Thread 2 -->
  <g transform="translate(60, 218)">
    <line x1="0" y1="0" x2="250" y2="0" stroke="#1E293B" stroke-width="0.5"/>
    <circle cx="24" cy="22" r="10" fill="#E1306C" fill-opacity="0.2"/>
    <text x="24" y="26" fill="#f472b6" font-size="11" text-anchor="middle">📸</text>
    <text x="42" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Selin Kaya (Butik)</text>
    <text x="235" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">8 dk</text>
    <text x="42" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Kargom bugün yola çıkar mı?...</text>
  </g>

  <!-- Inbox Thread 3 -->
  <g transform="translate(60, 285)">
    <line x1="0" y1="0" x2="250" y2="0" stroke="#1E293B" stroke-width="0.5"/>
    <circle cx="24" cy="22" r="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="24" y="26" fill="#38bdf8" font-size="11" text-anchor="middle">💬</text>
    <text x="42" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Burak Demir (Canlı)</text>
    <text x="235" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">22 dk</text>
    <text x="42" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">API entegrasyon dökümanına...</text>
  </g>

  <!-- Chat Detail View (Right Area: 490px) -->
  <rect x="310" y="48" width="490" height="452" fill="#12202a"/>

  <!-- Chat Header -->
  <g transform="translate(325, 60)">
    <circle cx="18" cy="18" r="16" fill="#059669"/>
    <text x="18" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">AY</text>
    <text x="44" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Ahmet Yılmaz</text>
    <rect x="135" y="6" width="112" height="18" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.5"/>
    <text x="191" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="9" text-anchor="middle">WhatsApp Business</text>
    <text x="44" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">KOBİ Satın Alma Yetkilisi • Tekno Mobilya</text>
    <text x="450" y="22" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Temsilci: <tspan fill="#ffffff" font-weight="700">Zeynep D.</tspan></text>
  </g>
  <line x1="310" y1="105" x2="800" y2="105" stroke="#1E293B" stroke-width="1"/>

  <!-- Customer Chat Bubble -->
  <g transform="translate(330, 125)">
    <circle cx="12" cy="12" r="12" fill="#059669" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#34d399" font-size="11" text-anchor="middle">✆</text>
    <rect x="32" y="0" width="370" height="46" rx="12" fill="#1a2e3b" stroke="#263d4a" stroke-width="0.7"/>
    <text x="46" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Merhaba, şirketimiz için 50 adet masaüstü takım alacağız.</text>
    <text x="46" y="34" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Toptan siparişte teslimat süresi ve iskontolarınız nedir acaba?</text>
  </g>

  <!-- Midvem AI Smart Draft Card -->
  <g transform="translate(330, 195)">
    <rect x="0" y="0" width="445" height="175" rx="14" fill="url(#aiCardGrad)" stroke="#1A8FB5" stroke-width="1" filter="url(#mvShadow)"/>

    <!-- Card Header -->
    <text x="16" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="12">✦ Midvem AI Yanıt Önerisi</text>
    <rect x="175" y="12" width="90" height="18" rx="4" fill="#0c4a6e"/>
    <text x="220" y="24" fill="#7dd3fc" font-family="system-ui, sans-serif" font-weight="700" font-size="9" text-anchor="middle">Doğruluk: %98</text>

    <rect x="345" y="12" width="86" height="20" rx="6" fill="#E8622A" fill-opacity="0.2" stroke="#E8622A" stroke-width="0.7"/>
    <text x="388" y="26" fill="#E8622A" font-family="system-ui, sans-serif" font-weight="700" font-size="9" text-anchor="middle">1 Tıkla Gönder</text>

    <!-- AI Generated Text Box -->
    <rect x="14" y="42" width="417" height="74" rx="8" fill="#07151e" stroke="#1e3a4b" stroke-width="0.7"/>
    <text x="26" y="62" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">"Ahmet Bey merhaba! 50 adet üzeri kurumsal siparişlerimizde</text>
    <text x="26" y="78" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">%18 toptan iskonto uyguluyoruz. Stoklarımız müsait olup 3 iş</text>
    <text x="26" y="94" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">gününde kargolanabilir. Özel teklif dosyamızı iletmemi ister misiniz?"</text>

    <!-- Action Buttons -->
    <rect x="14" y="126" width="165" height="34" rx="8" fill="url(#coralGrad)"/>
    <text x="96" y="147" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">✓ Taslağı Onayla &amp; Gönder</text>

    <rect x="190" y="126" width="75" height="34" rx="8" fill="#1e3a4b"/>
    <text x="227" y="147" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Düzenle</text>
  </g>

  <!-- Message Input Bar at bottom -->
  <g transform="translate(330, 425)">
    <rect x="0" y="0" width="395" height="40" rx="10" fill="#0d1b23" stroke="#263d4a" stroke-width="1"/>
    <text x="16" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Mesajınızı yazın veya AI&apos;dan öneri isteyin...</text>
    <rect x="405" y="0" width="40" height="40" rx="10" fill="url(#coralGrad)"/>
    <text x="425" y="25" fill="#ffffff" font-size="14" text-anchor="middle">➤</text>
  </g>
</svg>
