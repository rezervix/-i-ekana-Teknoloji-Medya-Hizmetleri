# Nginx Configuration Template for cicekanatechmedia.com
# Put this file on your Ubuntu server at: /etc/nginx/sites-available/cicekana
# Then create a symlink: ln -s /etc/nginx/sites-available/cicekana /etc/nginx/sites-enabled/
# And reload Nginx: sudo systemctl reload nginx

server {
    listen 80;
    server_name cicekanatechmedia.com www.cicekanatechmedia.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cicekanatechmedia.com www.cicekanatechmedia.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/cicekanatechmedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cicekanatechmedia.com/privkey.pem;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_vary on;

    # Static files Cache Busting / Cache-Control
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4028;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Next.js static assets are hashed, safe to cache permanently
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main application Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:4028;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Güvenlik & Coğrafi Tespit:
        # İstemciden gelen sahte X-Visitor-Country başlığını sıfırla / ez
        # Nginx GeoIP2 modülü aktif edildiğinde aşağıdaki satırı açın:
        # proxy_set_header X-Visitor-Country $geoip2_data_country_code;
        proxy_set_header X-Visitor-Country "";

        # Önbellek Kirlenmesini Önleme (Cache Poisoning Protection)
        add_header Vary "X-Visitor-Country, CF-IPCountry" always;

        # Force browser to revalidate main html pages (no stale HTML caching)
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
